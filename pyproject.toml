[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roe-map-parser"
version = "0.1.0"
description = "Terrain and collision data extraction for Ring of Elysium bot visibility checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "lz4>=4.3"]

[project.scripts]
roe-map-parser = "roe_map_parser.cli:main"

[tool.setuptools.packages.find]
include = ["roe_map_parser*"]
